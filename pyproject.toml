[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-auto-system-controller"
version = "0.1.0"
description = "Jarvis AI Voice Assistant for PC control with Google Gemini"
authors = [
    {name = "Muralikrishna", email = "muralikrishna@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.11",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools.packages.find]
where = ["jarvis"]

[tool.black]
line-length = 88
target-version = ['py311']
